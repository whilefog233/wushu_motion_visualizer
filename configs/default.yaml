app:
  title: "wushu_motion_visualizer"
  max_video_side: 1280
  default_camera_index: 0
  default_camera_width: 1280
  default_camera_height: 720
  recent_seconds_for_live_chart: 8

pose:
  model_complexity: 1
  enable_segmentation: false
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  visibility_threshold: 0.35
  smooth_landmarks: true
  store_world_landmarks: true

analysis:
  speed_smoothing_alpha: 0.35
  trajectory_seconds: 1.0

pipeline:
  algorithm_version: "2.0.0"
  # 默认只生成数据（pose.json / metrics.csv / analysis.json / muscle.json / power_chain.json），
  # 不生成完整 MP4。骨架/肌肉视频改为用户主动导出。
  output_side_by_side_default: false
  muscle_smoothing_alpha: 0.28
  muscle_baseline: 0.05

export:
  save_side_by_side_video: false
  side_by_side_filename: "side_by_side_video.mp4"
  keypoints_filename: "keypoints.json"
  metrics_filename: "metrics.csv"
  summary_filename: "summary.json"
  report_filename: "summary.md"

visualization:
  skeleton_background_bgr: [18, 18, 18]
  original_label: "Original"
  skeleton_label: "Skeleton"
  trajectory_radius: 2
  text_color_bgr: [240, 240, 240]
  show_trajectory_overlay: false
